[pytest]
testpaths = knee_viz/tests
# The system ROS 2 install registers pytest plugins in this interpreter. They
# are irrelevant here and two of them are broken: launch_testing cannot import
# (its own dependency `lark` is missing) and launch_ros registers a hook that
# only exists once launch_testing has loaded. Disable them by entry-point name.
addopts =
    -p no:launch_testing
    -p no:launch_ros
    -p no:ament_lint
    -p no:ament_copyright
    -p no:ament_flake8
    -p no:ament_pep257
    -p no:ament_xmllint
